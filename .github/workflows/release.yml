# When a GitHub release is published (tag vX.Y.Z): build the static binaries, .deb, .rpm,
# SBOMs and checksums for amd64 and arm64 on native runners, run the package tests, and
# upload everything to that release. The tag must match VERSION in the Makefile.
# Manual re-run for an existing release: Actions > release > Run workflow, give the tag.
name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag (vX.Y.Z)
        required: true
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: check the tag against the Makefile
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z" >&2; exit 1; }
          v=${TAG#v}
          grep -qx "VERSION := $v" Makefile || { echo "tag $TAG does not match Makefile VERSION" >&2; exit 1; }
          echo "VERSION=$v" >>"$GITHUB_ENV"
      - name: build
        run: scripts/build-release.sh "$VERSION" ${{ matrix.arch }} dist/${{ matrix.arch }}
      - name: package tests
        run: ./dev make test-packaging BUILD=release DIST=dist/${{ matrix.arch }} GIT_REV="$(git rev-parse --short=12 HEAD)"
      - name: install tests in fresh containers
        run: bash tests/host/test_packages_host.sh "$VERSION" dist/${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bastion-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: combined checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum bastion-*-linux-* bastion_*.deb bastion-*.rpm >SHA256SUMS
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
