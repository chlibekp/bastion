# Unit, integration, conformance and fuzz-smoke on x86_64 and arm64; VM tests where KVM exists;
# the release build and package tests on both architectures. Everything runs through ./dev, the
# same containers as local development.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new CVEs against unchanged pins, new CodeQL queries
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: unit
        run: ./dev make test-unit
      - name: integration
        run: ./dev make test-int
      - name: integration, real seccomp (no sanitizers)
        run: ./dev make TEST_BUILD=debug test-int
      - name: conformance
        run: ./dev make conformance
      - name: fuzz smoke
        run: ./dev make fuzz-smoke SECS=30

  vm:
    # GitHub's larger x86_64 Linux runners expose /dev/kvm; scripts/vm-run.sh needs it.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: vm (floor kernel)
        run: ./dev make test-vm KERNEL=floor
      - name: vm (current kernel)
        run: ./dev make test-vm KERNEL=current

  static-analysis:
    # docs/security.md: the clang static analyzer and cppcheck from the dev image. Findings are
    # reported, not gating: each one is triaged there (fixed or justified).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: scan-build
        # Single quotes on purpose: $(nproc) expands inside the container.
        run: |
          # shellcheck disable=SC2016
          ./dev bash -c 'make deps && CCC_CC=clang scan-build-19 --use-cc=clang -o build/scan make -k -j"$(nproc)" BUILD=debug'
      - name: cppcheck
        run: ./dev cppcheck -j4 --std=c11 --enable=warning,portability -q -D_GNU_SOURCE -DBST_TEST -Isrc --suppress=missingIncludeSystem --suppress=normalCheckLevelMaxBranches src

  codeql:
    # CodeQL is not in Debian, so it runs here and not in ./dev. build-mode none: the real build
    # runs inside the container, where the CodeQL tracer cannot follow it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          languages: c-cpp
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5

  deps-cve:
    # Published CVEs against the exact versions pinned in deps/versions.env (NVD, by CPE).
    # Allowed ids are reviewed in docs/security.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: dependency CVE check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 scripts/check-deps-cve.py --allow CVE-2019-0190

  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    # The .deb is built only from a tree whose unit and integration tests passed.
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: version from the Makefile
        run: |
          v=$(sed -n 's/^VERSION := //p' Makefile)
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad Makefile VERSION '$v'" >&2; exit 1; }
          echo "VERSION=$v" >>"$GITHUB_ENV"
      - name: release checks
        run: ./dev make check-release BUILD=release
      - name: package tests (builds the static binary, .deb and .rpm into dist/)
        run: ./dev make test-packaging BUILD=release GIT_REV="$(git rev-parse --short=12 HEAD)"
      - name: scratch image
        # test_packages_host.sh looks for bastion:<version>-<arch>, the tag build-release.sh uses.
        run: docker build -q -t "bastion:$VERSION-${{ matrix.arch }}" -f docker/scratch.Dockerfile --build-arg "BIN=dist/bastion-$VERSION-linux-${{ matrix.arch }}" .
      - name: install tests in fresh containers (debian:trixie, ubuntu:24.04, almalinux:9)
        run: bash tests/host/test_packages_host.sh "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bastion-${{ matrix.arch }}
          path: |
            dist/bastion_*.deb
            dist/bastion-*.rpm
            dist/bastion-*-linux-${{ matrix.arch }}
            dist/bastion-*-linux-${{ matrix.arch }}.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
