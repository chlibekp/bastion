# HTTPS with automatic certificates from Let's Encrypt (docs/guide/tls.md).
# `tls auto` without a `listen` listens on 443 (HTTP/1.1 and HTTP/2) and on 80, where every
# request except an ACME challenge is redirected to https. Ports 80 and 443 must reach this host
# and the names must resolve to it before the first certificate can be issued.

user bastion;

acme {
    email admin@example.com;
    # staging on;    # try against Let's Encrypt's staging CA first
}

server {
    name example.com www.example.com;
    tls auto;
    root /srv/www;
    security_headers basic;
}
