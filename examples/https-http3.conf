# HTTPS with HTTP/3 and automatic certificates (docs/guide/tls.md).
# `tls auto` alone does not add an HTTP/3 listener: list the listeners yourself. With explicit
# listeners nothing redirects port 80 for you, so a second server does it, and the certificate is
# validated over port 443 (tls-alpn-01), which the TLS server answers itself.

user bastion;

acme {
    email admin@example.com;
    challenge tls-alpn-01;
}

server {
    name example.com;
    listen 443 tls http2;
    listen [::]:443 tls http2;
    listen 443 http3;
    listen [::]:443 http3;
    tls auto;
    root /srv/www;
    security_headers basic;
}

server {
    name example.com;
    listen 80;
    listen [::]:80;
    redirect_https 308;
}
