# A static site on plain HTTP. docs/guide/static-sites.md explains each line.
# Check it with `bastion -t -c static-site.conf`.

user bastion;
workers auto;

access_log /var/log/bastion/access.log;

server {
    listen 80;
    listen [::]:80;
    name example.com www.example.com;
    root /srv/www;
    index index.html;

    # Single-page app: unknown paths fall back to the app's entry point.
    try_files $uri $uri/ /index.html;

    # Fingerprinted assets never change; let browsers keep them.
    location /assets/ {
        expires 1y immutable;
    }

    error_page 404 /404.html;
    compress zstd br gzip;
}
