# A reverse proxy in front of two application servers (docs/guide/reverse-proxy.md).

user bastion;

upstream app {
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    balance least_conn;
    health_check path=/healthz interval=5s;
    retry attempts=1 on=error,timeout;
}

acme { email admin@example.com; }

server {
    name app.example.com;
    tls auto;
    proxy app;

    location /ws/ {
        proxy app;
        websocket on;
    }

    location /static/ {
        root /srv/www;
        expires 7d;
    }
}
