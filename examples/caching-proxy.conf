# A caching reverse proxy (docs/guide/caching.md).

user bastion;

cache_store main {
    disk /var/cache/bastion size=10g;
    ram 256m;
}

server {
    listen 80;
    proxy http://127.0.0.1:3000;
    cache main;
    # Responses without their own freshness information are kept this long.
    cache_valid 200 301 5m;
    # Logged-in users always reach the application.
    cache_bypass $cookie_session;
    # Only the deploy host may send PURGE.
    purge_method_allow 127.0.0.1/32;
}
