# Layered protection against floods and abusive clients (docs/guide/ddos.md).
# xdp {} needs CAP_BPF and CAP_NET_ADMIN; without them Bastion logs a warning and every
# request-level limit below still applies.

user bastion;

xdp {
    interface eth0;
    syn_rate 200/s burst=400;
    udp_rate 1000/s burst=2000;
}

limit_conn per_ip=100;

# `challenge auto` shows the proof-of-work page only while either rate is reached.
challenge_auto_rps 2000;
challenge_auto_block_rate 200;

limit_zone per_ip {
    rate 20/s burst=40;
    escalate after=50 window=10s block=10m;
}

limit_zone login {
    rate 1/s burst=5;
}

acme { email admin@example.com; }

server {
    name example.com;
    tls auto;
    proxy http://127.0.0.1:3000;
    limit per_ip;
    challenge auto;

    location /login {
        limit login per_ip;
    }
}
