# Template for scripts/bench.sh: matches bench/bastion.conf (2 workers, open file cache,
# long keep-alive, no access log). @ROOT@, @PORT@ and @WORK@ are substituted.
worker_processes 2;
error_log @WORK@/nginx-error.log warn;
pid @WORK@/nginx.pid;
events { worker_connections 4096; }
http {
    access_log off;
    sendfile on;
    open_file_cache max=1000 inactive=60s;
    keepalive_timeout 65s;
    keepalive_requests 1000000;
    server {
        listen 127.0.0.1:@PORT@;
        root @ROOT@;
    }
}
